   services:
     caddy:
       image: caddy:2
       restart: unless-stopped
       ports:
         - "80:80"
       volumes:
         - ./Caddyfile:/etc/caddy/Caddyfile
         - ./site:/srv
       depends_on:
         - backend

     backend:
       build: ./backend
       restart: unless-stopped
       environment:
         DATABASE_URL: postgresql+psycopg://campus:${POSTGRES_PASSWORD}@db:5432/campus
       depends_on:
         db:
           condition: service_healthy

     db:
       image: postgres:17
       restart: unless-stopped
       environment:
         POSTGRES_USER: campus
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: campus
       volumes:
         - pgdata:/var/lib/postgresql/data
       healthcheck:
         test: ["CMD-SHELL", "pg_isready -U campus"]
         interval: 5s
         timeout: 3s
         retries: 10

   volumes:
     pgdata:
